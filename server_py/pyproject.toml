# server/pyproject.toml

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-viewer-server"
version = "0.1.0"
description = "Python server for the scientific 3D viewer"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "Flask-Cors>=4.0",
    "Flask-RESTful>=0.3.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
sci-viewer-server = "viewer_server.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
